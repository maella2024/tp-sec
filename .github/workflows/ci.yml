name: CI

on:
  push:
    branches: [boudinm]

jobs:
  deploy:
    name: Mise en place
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ci
        run: npm install --legacy-peer-deps
      
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

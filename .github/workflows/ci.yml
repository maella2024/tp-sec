name: CI

on:
  push:
    branches: [boudinm]

jobs:
  lint:
    name: Mise en place
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: action/setup-node@v6

      - name: Install dependencies
        run: npm ci
      
      - name: lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Deploy project
        run: npm run deploy


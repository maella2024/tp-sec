name: CI

on:
  push:
    branches: [boudinm]

jobs:
  deploy:
    name: Mise en place
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: action/setup-node@v6
        with : 
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy project
        run: npm run deploy
      
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint


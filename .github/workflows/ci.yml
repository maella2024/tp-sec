name: CI

on:
  push:
    branches: [boudinm]

jobs:
  deploy:
    name: Mise en place
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install ci
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy project
        run: npm run deploy
      
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

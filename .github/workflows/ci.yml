name: CI

on:
  push:
    branches: [boudinm]

jobs:
  deploy:
    name: Mise en place
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install ci
        run: npm ci
      
      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy project
        run: npm run deploy
      
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
